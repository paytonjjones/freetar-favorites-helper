<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Freetar Favorites Helper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Freetar Favorites</h1>
      <button id="downloadFavorites" type="button">Download favorites</button>
      <button id="uploadFavorites" type="button">Upload favorites</button>
      <input id="favoritesFile" type="file" accept="application/json,.json">
      <details id="advanced">
        <summary><span class="disclosure" aria-hidden="true">▸</span><span>Advanced</span></summary>
        <div class="advanced-body">
          <button id="clearFavorites" type="button" class="destructive">Clear all Favorites from Freetar</button>
        </div>
      </details>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
