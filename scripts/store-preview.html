<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Freetar Favorites Helper Preview</title>
    <link rel="stylesheet" href="../popup.css">
    <style>
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #f3f4f6;
      }

      .preview-shell {
        width: 420px;
        padding: 18px;
        border: 1px solid #dbe0e8;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
      }

      main {
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <div class="preview-shell">
      <main>
        <h1><img class="title-icon" src="../store-icon.png" alt="">Freetar Favorites Helper</h1>
        <button type="button">Get favorites from Ultimate Guitar (must be logged in)</button>
        <button type="button">Upload to Freetar</button>
        <details id="advanced" open>
          <summary><span>Advanced</span><span class="disclosure" aria-hidden="true">▸</span></summary>
          <div class="advanced-body">
            <button type="button" class="destructive">Clear all Favorites from Freetar</button>
          </div>
        </details>
        <p id="status">Ready to move favorites between Ultimate Guitar and Freetar.</p>
      </main>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      if (params.get("theme") === "dark") {
        document.documentElement.style.colorScheme = "dark";
        document.body.style.background = "#111827";
        document.querySelector(".preview-shell").style.background = "#0f172a";
        document.querySelector(".preview-shell").style.borderColor = "#334155";
        document.querySelector(".preview-shell").style.boxShadow = "0 24px 70px rgba(0, 0, 0, 0.45)";
        document.querySelector("h1").style.color = "#f8fafc";
        document.querySelector("#status").style.color = "#cbd5e1";
      }
    </script>
  </body>
</html>
